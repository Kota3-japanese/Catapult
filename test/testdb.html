<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>db.js テスト</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 16px;
      }
      .pass {
        color: green;
      }
      .fail {
        color: red;
      }
      .info {
        color: gray;
      }
      #preview {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
      figure {
        margin: 0;
        border: 1px solid #ccc;
        padding: 8px;
        max-width: 260px;
      }
      figure img {
        max-width: 100%;
        display: block;
      }
      figure pre {
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>db.js テスト</h1>
    <p>結果はこの画面と、開発者ツールのコンソールに表示されます。</p>

    <h2>テスト結果</h2>
    <ul id="results"></ul>

    <h2>投稿した日記（DBから返ってきた値と画像）</h2>
    <div id="preview"></div>

    <!-- type="module" で読み込む。db-test.js が db.js → auth.js を順に読み込む -->
    <script type="module" src="./dbtest.js"></script>
  </body>
</html>
