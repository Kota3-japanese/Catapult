
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>笑顔採点アプリ</title>
    <link rel="stylesheet" href="../CSS/camera.css">
</head>
<body>
    <main class="container">
        <h1>笑顔採点アプリ 😊</h1>
        <p>カメラに向かって笑顔を見せてね！</p>

        <div class="camera-area">
            <video id="camera" autoplay playsinline muted></video>
            <canvas id="overlay"></canvas>
        </div>

        <p id="status">カメラの準備中...</p>

        <div class="score-area">
            <p>笑顔スコア</p>
            <div id="score">--<span>点</span></div>
        </div>

        <div class="buttons">
            <button id="startButton">カメラを起動</button>
            <button id="captureButton" disabled>写真を撮影</button>
        </div>

        <p id="message">カメラを起動して撮影してみよう！</p>

        <section id="result" hidden>
            <h2>撮影結果</h2>
            <img id="photo" alt="撮影した笑顔の写真">
            <p id="resultScore"></p>
            <a id="downloadButton" download="smile.png">写真を保存</a>
        </section>
    </main>

    <script type="module" src="../JS/camera.js"></script>
</body>
</html>
